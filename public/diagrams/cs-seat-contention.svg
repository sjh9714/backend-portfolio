<svg xmlns="http://www.w3.org/2000/svg" width="880" height="370" viewBox="0 0 880 370" role="img" aria-labelledby="title desc">
<title id="title">좌석 상태와 현재 소유자를 함께 확인</title>
<desc id="desc">A 예약 취소 후 B 예약이 좌석을 선점한다. A의 반환 요청을 재처리해도 현재 소유 예약이 B이므로 좌석을 반환하지 않는다.</desc>
<style>text{font-family:Pretendard,Apple SD Gothic Neo,Malgun Gothic,sans-serif;fill:#171a21}.title{font-size:22px;font-weight:650}.label{font-size:18px;font-weight:650}.body{font-size:16px;fill:#555f70}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#0016ec" stroke-width="1.5"/></marker></defs>
<rect width="880" height="370" fill="#f6f7fa"/><text x="28" y="42" class="title">좌석 상태와 현재 소유자를 함께 확인</text>
<rect x="28" y="74" width="264" height="198" rx="8" fill="white" stroke="#dcdee8"/>
<text x="46" y="108" class="label">A 예약 종료</text>
<text x="46" y="145" dy="0" class="body">좌석은 A가 선점 중</text>
<text x="46" y="145" dy="28" class="body">A 취소와 좌석 반환</text>
<text x="46" y="145" dy="56" class="body">하나의 DB 트랜잭션</text>
<text x="46" y="145" dy="84" class="body">좌석: AVAILABLE</text>
<path d="M292 173 H308" stroke="#0016ec" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="308" y="74" width="264" height="198" rx="8" fill="white" stroke="#dcdee8"/>
<text x="326" y="108" class="label">B가 같은 좌석 선점</text>
<text x="326" y="145" dy="0" class="body">좌석: HELD</text>
<text x="326" y="145" dy="28" class="body">현재 소유 예약: B</text>
<text x="326" y="145" dy="56" class="body">과거 A의 관계는 남아 있음</text>
<text x="326" y="145" dy="84" class="body">이 관계가 현재 소유는 아님</text>
<path d="M572 173 H588" stroke="#0016ec" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="588" y="74" width="264" height="198" rx="8" fill="white" stroke="#dcdee8"/>
<text x="606" y="108" class="label">A의 반환을 다시 처리</text>
<text x="606" y="145" dy="0" class="body">반환 요청 예약: A</text>
<text x="606" y="145" dy="28" class="body">좌석의 현재 소유 예약: B</text>
<text x="606" y="145" dy="56" class="body">일치하지 않으므로 변경 안 함</text>
<text x="606" y="145" dy="84" class="body">B의 선점 유지</text>
<text x="28" y="311" class="label" style="fill:#0016ec">반환 조건: 종료된 예약 + HELD + 소유 예약 ID 일치</text>
<text x="28" y="342" class="body">같은 요청의 반복뿐 아니라, 그 사이에 다른 예약이 생기는 순서를 테스트합니다.</text></svg>