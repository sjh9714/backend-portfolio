<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-label="클라이언트 재시도는 Idempotency-Key 검사에서, PG webhook 재전달은 서명 검증과 이벤트 ID 중복 제거에서 각각 차단되어 append-only 원장에는 한 번만 반영되는 경로도">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0a0b0d"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0016ec"/>
    </marker>
  </defs>
  <style>
    .b{fill:#fff;stroke:#0a0b0d;stroke-width:1.5}
    .b2{fill:#f0f1fa;stroke:#dcdee8;stroke-width:1.5}
    .bc{fill:#fff;stroke:#0016ec;stroke-width:2}
    .t{fill:#0a0b0d;font:600 13px Pretendard,-apple-system,sans-serif}
    .s{fill:#5a5f6e;font:11px Pretendard,-apple-system,sans-serif}
    .m{fill:#5a5f6e;font:11px ui-monospace,Menlo,monospace}
    .a{fill:#0016ec;font:600 12px ui-monospace,Menlo,monospace}
    .ln{stroke:#0a0b0d;stroke-width:1.4;fill:none}
    .lnb{stroke:#0016ec;stroke-width:1.4;fill:none}
  </style>

  <text x="20" y="28" class="m">중복이 들어오는 두 경로와 각각의 차단 지점</text>
  <line x1="20" y1="42" x2="860" y2="42" stroke="#0a0b0d" stroke-width="1.5"/>

  <!-- 경로 1: 클라이언트 재시도 -->
  <rect x="20" y="76" width="160" height="56" rx="2" class="b2"/>
  <text x="100" y="98" text-anchor="middle" class="t">클라이언트 재시도</text>
  <text x="100" y="116" text-anchor="middle" class="s">같은 사용량 2회 전송</text>

  <line x1="180" y1="104" x2="226" y2="104" class="ln" marker-end="url(#ar)"/>
  <rect x="232" y="76" width="240" height="56" rx="2" class="bc"/>
  <text x="352" y="98" text-anchor="middle" class="a">Idempotency-Key 검사</text>
  <text x="352" y="116" text-anchor="middle" class="s">같은 키 → 새 row 없음 · 다른 본문 → conflict</text>

  <!-- 경로 2: webhook 재전달 -->
  <rect x="20" y="164" width="160" height="56" rx="2" class="b2"/>
  <text x="100" y="186" text-anchor="middle" class="t">PG webhook 재전달</text>
  <text x="100" y="204" text-anchor="middle" class="s">같은 결제 이벤트 2회</text>

  <line x1="180" y1="192" x2="226" y2="192" class="ln" marker-end="url(#ar)"/>
  <rect x="232" y="164" width="240" height="56" rx="2" class="bc"/>
  <text x="352" y="186" text-anchor="middle" class="a">HMAC 서명 → 이벤트 ID dedup</text>
  <text x="352" y="204" text-anchor="middle" class="s">위조 차단 후 providerEventId로 중복 제거</text>

  <!-- 원장 -->
  <line x1="472" y1="104" x2="540" y2="140" class="lnb" marker-end="url(#arb)"/>
  <line x1="472" y1="192" x2="540" y2="156" class="lnb" marker-end="url(#arb)"/>

  <rect x="546" y="118" width="314" height="80" rx="2" class="b"/>
  <text x="703" y="144" text-anchor="middle" class="t">append-only 원장</text>
  <text x="703" y="164" text-anchor="middle" class="s">잔액을 UPDATE하지 않고 엔트리를 덧붙인다</text>
  <text x="703" y="182" text-anchor="middle" class="s">환불도 삭제가 아니라 반대 방향 엔트리</text>

  <text x="546" y="222" class="a">중복 계량 0건 · 중복 결제 반영 0건</text>

  <line x1="20" y1="256" x2="860" y2="256" stroke="#dcdee8" stroke-width="1.5"/>

  <!-- 검증 시나리오 -->
  <text x="20" y="282" class="t">검증 — 4개 경로를 모두 실행하는 혼합 시나리오 3회 반복</text>
  <rect x="20" y="296" width="200" height="44" rx="2" class="b2"/>
  <text x="120" y="323" text-anchor="middle" class="s">게이트웨이 호출</text>
  <rect x="230" y="296" width="200" height="44" rx="2" class="b2"/>
  <text x="330" y="323" text-anchor="middle" class="s">직접 사용량 계량</text>
  <rect x="440" y="296" width="200" height="44" rx="2" class="b2"/>
  <text x="540" y="323" text-anchor="middle" class="s">인보이스 생성</text>
  <rect x="650" y="296" width="210" height="44" rx="2" class="b2"/>
  <text x="755" y="323" text-anchor="middle" class="s">webhook 중복 전달</text>

  <text x="20" y="368" class="a">체크 150/150 통과 · HTTP 실패 0/150 · 3회 반복 모두 동일</text>
  <text x="20" y="400" class="m">부하 테스트 RPS는 5 VU 조건이라 처리량 지표로 쓰지 않음</text>
</svg>
