<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-label="행 잠금은 트랜잭션이 끝나면서 풀려 정작 3에서 6초 걸리는 외부 호출 동안에는 아무도 그 행을 지키지 않았고, 지금은 PENDING을 SUBMITTED로 바꾸는 원자적 UPDATE로 집어 두 인스턴스가 같은 행을 가져갈 수 없게 만든 구조 비교도">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0a0b0d"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0016ec"/>
    </marker>
  </defs>
  <style>
    .b{fill:#fff;stroke:#0a0b0d;stroke-width:1.5}
    .b2{fill:#f0f1fa;stroke:#dcdee8;stroke-width:1.5}
    .bc{fill:#fff;stroke:#0016ec;stroke-width:2}
    .t{fill:#0a0b0d;font:600 13px Pretendard,-apple-system,sans-serif}
    .s{fill:#5a5f6e;font:11px Pretendard,-apple-system,sans-serif}
    .m{fill:#5a5f6e;font:11px ui-monospace,Menlo,monospace}
    .a{fill:#0016ec;font:600 12px ui-monospace,Menlo,monospace}
    .ln{stroke:#0a0b0d;stroke-width:1.4;fill:none}
    .lnb{stroke:#0016ec;stroke-width:1.4;fill:none}
    .dash{stroke:#5a5f6e;stroke-width:1.2;stroke-dasharray:4 3;fill:none}
  </style>

  <text x="20" y="28" class="m">3~6초 걸리는 외부 호출 동안 그 행을 무엇이 지키는가</text>
  <line x1="20" y1="42" x2="860" y2="42" stroke="#0a0b0d" stroke-width="1.5"/>

  <!-- 이전 -->
  <text x="20" y="70" class="t">이전 — 잠그고, 놓고, 부른다</text>

  <rect x="20" y="82" width="250" height="52" rx="2" class="b"/>
  <text x="145" y="103" text-anchor="middle" class="t">트랜잭션 A</text>
  <text x="145" y="121" text-anchor="middle" class="m">SELECT … FOR UPDATE SKIP LOCKED</text>

  <line x1="270" y1="108" x2="316" y2="108" class="ln" marker-end="url(#ar)"/>

  <rect x="322" y="82" width="180" height="52" rx="2" class="b2"/>
  <text x="412" y="103" text-anchor="middle" class="t">커밋 — 잠금 해제</text>
  <text x="412" y="121" text-anchor="middle" class="s">여기서 이미 풀린다</text>

  <line x1="502" y1="108" x2="548" y2="108" class="ln" marker-end="url(#ar)"/>

  <rect x="554" y="76" width="306" height="64" rx="2" class="b"/>
  <text x="707" y="99" text-anchor="middle" class="t">트랜잭션 B — 외부 이미지 생성 API 호출</text>
  <text x="707" y="118" text-anchor="middle" class="s">3~6초. 이 구간을 지키는 것이 아무것도 없다</text>
  <text x="707" y="134" text-anchor="middle" class="s">다른 인스턴스가 같은 행을 다시 집을 수 있다</text>

  <path d="M412 140 L412 162 L707 162 L707 148" class="dash"/>
  <text x="560" y="178" text-anchor="middle" class="s">잠금이 필요한 구간과 잠금이 살아 있는 구간이 어긋난다</text>

  <line x1="20" y1="198" x2="860" y2="198" stroke="#dcdee8" stroke-width="1.5"/>

  <!-- 현재 -->
  <text x="20" y="226" class="t">지금 — 잠금이 아니라 상태로 집는다</text>

  <rect x="20" y="232" width="300" height="74" rx="2" class="bc"/>
  <text x="170" y="253" text-anchor="middle" class="a">UPDATE … SET status='SUBMITTED'</text>
  <text x="170" y="270" text-anchor="middle" class="a">… RETURNING id</text>
  <text x="170" y="288" text-anchor="middle" class="s">집는 것과 표시하는 것이 한 문장이다</text>
  <text x="170" y="303" text-anchor="middle" class="s">원자적이라 두 인스턴스가 같은 행을 못 가져간다</text>

  <line x1="320" y1="269" x2="366" y2="269" class="lnb" marker-end="url(#arb)"/>

  <rect x="372" y="244" width="150" height="50" rx="2" class="b"/>
  <text x="447" y="265" text-anchor="middle" class="t">외부 API 호출</text>
  <text x="447" y="282" text-anchor="middle" class="s">커넥션을 붙들지 않는다</text>

  <line x1="522" y1="269" x2="568" y2="269" class="lnb" marker-end="url(#arb)"/>

  <rect x="574" y="238" width="286" height="62" rx="2" class="b"/>
  <text x="717" y="259" text-anchor="middle" class="a">PENDING → SUBMITTED → READY / FAILED</text>
  <text x="717" y="277" text-anchor="middle" class="s">집은 직후 죽으면 job id 없는 SUBMITTED가 남고</text>
  <text x="717" y="293" text-anchor="middle" class="s">일정 시간이 지나면 PENDING으로 되돌린다</text>

  <line x1="20" y1="322" x2="860" y2="322" stroke="#dcdee8" stroke-width="1.5"/>

  <text x="20" y="348" class="t">검증 — Testcontainers 실 PostgreSQL 통합 테스트</text>
  <rect x="20" y="360" width="205" height="40" rx="2" class="b2"/>
  <text x="122" y="385" text-anchor="middle" class="s">동시에 요청해도 그림은 하나</text>
  <rect x="235" y="360" width="205" height="40" rx="2" class="b2"/>
  <text x="337" y="385" text-anchor="middle" class="s">같은 날 두 번 요청해도 하나</text>
  <rect x="450" y="360" width="200" height="40" rx="2" class="b2"/>
  <text x="550" y="385" text-anchor="middle" class="s">세 번까지 재시도하고 이유를 남김</text>
  <rect x="660" y="360" width="200" height="40" rx="2" class="b2"/>
  <text x="760" y="385" text-anchor="middle" class="s">응답 없는 작업을 되돌린다</text>
</svg>
