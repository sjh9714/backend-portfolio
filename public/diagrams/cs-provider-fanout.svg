<svg xmlns="http://www.w3.org/2000/svg" width="880" height="370" viewBox="0 0 880 370" role="img" aria-labelledby="title desc">
<title id="title">조회는 공유하고, 미확인은 그대로 전달</title>
<desc id="desc">DEMO와 LIVE 공급자를 분리한다. 같은 원본을 조회하는 진행 중 Task를 공유하고 시설 존재와 현재 운행 여부를 구분해 반환한다.</desc>
<style>text{font-family:Pretendard,Apple SD Gothic Neo,Malgun Gothic,sans-serif;fill:#333d4b}.title{font-size:22px;font-weight:650}.label{font-size:18px;font-weight:650}.body{font-size:16px;fill:#6b7684}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#1b64da" stroke-width="1.5"/></marker></defs>
<rect width="880" height="370" fill="#f2f4f6"/><text x="28" y="42" class="title">조회는 공유하고, 미확인은 그대로 전달</text>
<rect x="28" y="74" width="264" height="198" rx="8" fill="white" stroke="#e5e8eb"/>
<text x="46" y="108" class="label">모드와 출처 구분</text>
<text x="46" y="145" dy="0" class="body">DEMO: 합성 정보</text>
<text x="46" y="145" dy="28" class="body">LIVE: 외부 공급자 조회</text>
<text x="46" y="145" dy="56" class="body">확인 못 한 정보: UNKNOWN</text>
<text x="46" y="145" dy="84" class="body">합성 대체 값을 섞지 않음</text>
<path d="M292 173 H308" stroke="#1b64da" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="308" y="74" width="264" height="198" rx="8" fill="white" stroke="#e5e8eb"/>
<text x="326" y="108" class="label">진행 중 조회 공유</text>
<text x="326" y="145" dy="0" class="body">빈 캐시에 동시 요청</text>
<text x="326" y="145" dy="28" class="body">같은 원본의 Task를 함께 대기</text>
<text x="326" y="145" dy="56" class="body">실패는 정상 캐시에 저장 안 함</text>
<text x="326" y="145" dy="84" class="body">대기자 취소는 shield로 분리</text>
<path d="M572 173 H588" stroke="#1b64da" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="588" y="74" width="264" height="198" rx="8" fill="white" stroke="#e5e8eb"/>
<text x="606" y="108" class="label">정보의 의미 구분</text>
<text x="606" y="145" dy="0" class="body">exists: 시설 목록에 존재</text>
<text x="606" y="145" dy="28" class="body">status: 현재 운행 여부</text>
<text x="606" y="145" dy="56" class="body">fetchedAt: 목록 조회 시각</text>
<text x="606" y="145" dy="84" class="body">observedAt: 운행 관측 시각</text>
<text x="28" y="311" class="label" style="fill:#1b64da">시설이 목록에 있다는 사실만으로 지금 이용 가능하다고 답하지 않습니다.</text>
<text x="28" y="342" class="body">요청 공유는 한 프로세스 안의 보장입니다. 실제 경로 정확도와 현장 이용 가능성은 미검증입니다.</text></svg>