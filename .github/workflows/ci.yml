name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:writing
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      # 사진·다이어그램을 얹은 뒤로 성능이 조용히 새지 않도록 게이트를 건다.
      #
      # 사이트의 모든 페이지를 검사한다. 전에는 홈과 상세 하나만 봤는데,
      # 그동안 /resume의 접근성이 95로 내려가 있었고 게이트가 그걸 보지 못했다
      # (연락처 링크가 14px이라 WCAG 목표 크기 24px에 못 미쳤다).
      # 검사하지 않는 페이지는 게이트가 없는 것과 같다.
      #
      # 재는 순서가 점수를 바꾸면 안 된다.
      #
      # 처음 이 게이트를 다섯 페이지로 넓혔더니 CI에서 36 → 78 → 97 → 98 → 98로
      # 재는 순서대로 점수가 올라갔다. 페이지가 무거운 게 아니라 기계가 데워지는 중이었다 —
      # lighthouse를 내려받는 npx 설치와 정적 서버 기동이 첫 측정과 겹쳤다.
      # 같은 커밋을 로컬에서 CPU 12배로 조여 재면 홈이 98(TBT 60ms)인데
      # CI 첫 측정은 36(TBT 5,480ms)이었다. 90배 차이는 CPU 속도로 설명되지 않는다.
      #
      # 그래서 재기 전에 두 가지를 끝내 둔다 — lighthouse 설치, 그리고 버리는 예열 측정.
      - name: Lighthouse 게이트 (모바일)
        run: |
          npx serve out -l 3100 &
          npx --yes wait-on http://localhost:3100 --timeout 60000

          # 내려받기를 측정 밖으로 뺀다
          npx --yes lighthouse@12 --version

          # 첫 측정은 버린다. 이 결과는 채점하지 않는다.
          npx --yes lighthouse@12 "http://localhost:3100/" \
            --only-categories=performance --quiet \
            --chrome-flags="--headless=new --no-sandbox" \
            --output=json --output-path=./lh-warmup.json
          echo "예열 완료 (이 결과는 쓰지 않는다)"

          targets="home:/ concert:/projects/concert-booking finmate:/projects/finmate"
          targets="$targets chat:/projects/realtime-chat resume:/resume"
          failed=""
          for target in $targets; do
            name="${target%%:*}"
            # 변수 이름을 route로 둔다. zsh에서 path는 PATH와 연동된 특수 변수라
            # path=/projects/... 가 PATH를 통째로 덮는다. 로컬에서 그걸로 한 번 헤맸다.
            route="${target#*:}"
            # 실패하면 두 번까지 다시 잰다. 공유 러너에서는 같은 빌드 산출물이
            # TBT 60ms로 통과했다가 800ms로 떨어지기도 했다(63eecad 통과 → 동일
            # out/의 2d035d9 실패). 진짜 회귀는 세 번 다 걸리고, 러너 소음은 흡수된다.
            passed=""
            for attempt in 1 2 3; do
              npx --yes lighthouse@12 "http://localhost:3100${route}" \
                --only-categories=performance,accessibility,best-practices,seo \
                --quiet --chrome-flags="--headless=new --no-sandbox" \
                --output=json --output-path="./lh-${name}.json"
              echo "── ${name} (${route}) — ${attempt}번째 측정"
              if node scripts/check-lighthouse.mjs "./lh-${name}.json"; then
                passed=1; break
              fi
            done
            # 첫 실패에서 멈추지 않는다. 한 번 돌려서 어느 페이지가 걸리는지 다 보는 편이
            # 고치기 쉽다.
            [ -n "$passed" ] || failed="$failed ${name}"
          done
          if [ -n "$failed" ]; then
            echo "게이트 실패:$failed"
            exit 1
          fi

      - name: Lighthouse 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lh-*.json
          if-no-files-found: ignore
