name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      # WebGL·시뮬레이터를 얹은 뒤로 성능이 조용히 새지 않도록 게이트를 건다.
      # 특히 프리로더는 길어지는 만큼 LCP를 그대로 밀기 때문에 수치로 묶어 둔다.
      - name: Lighthouse 게이트 (모바일)
        run: |
          npx serve out -l 3100 &
          npx --yes wait-on http://localhost:3100 --timeout 60000
          npx --yes lighthouse@12 http://localhost:3100/ \
            --only-categories=performance,accessibility,best-practices,seo \
            --quiet --chrome-flags="--headless=new --no-sandbox" \
            --output=json --output-path=./lh-home.json
          node scripts/check-lighthouse.mjs ./lh-home.json

      - name: Lighthouse 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-home
          path: lh-home.json
          if-no-files-found: ignore
